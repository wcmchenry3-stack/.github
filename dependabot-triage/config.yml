# Dependabot triage agent — runtime configuration.
#
# Every limit here is a safety valve. Raising one widens the blast radius of a
# misclassification, so change them one at a time and watch the precision metric
# in the nightly email before going further.

owner: wcmchenry3-stack

# Repos are opted in individually. `enabled: false` is the per-repo kill switch;
# it is honoured before any API call is made against that repo.
repos:
  - name: powerplayshistory_site
    enabled: true
    base: dev
    merge_method: merge # ruleset on this repo forbids squash
  - name: buffingchi_site
    enabled: true
    base: dev
    merge_method: merge
  - name: BC-Arcade
    enabled: true
    base: dev
    merge_method: squash
  - name: BookshelfAI
    enabled: true
    base: dev
    merge_method: merge
  - name: wcm_portfolio_site
    enabled: true
    base: dev
    merge_method: merge
  - name: RulersAI
    enabled: true
    base: dev
    merge_method: merge

# Blast-radius caps. A bad classification cannot cascade across the stack
# before the morning email lands.
caps:
  max_merges_per_repo: 5
  max_merges_total: 15

# Wall-clock budgets, in seconds.
timeouts:
  rebase_wait: 1200 # 20 min for Dependabot to land a rebase, then defer
  checks_wait: 2700 # 45 min, sized for BC-Arcade's 20-30 min CI
  poll_interval: 60
  global_wall_clock: 14400 # 4 h; job timeout-minutes is set slightly above this
  # `gh pr merge` fails with "not mergeable" for a few seconds to a couple of
  # minutes after any push, while GitHub is still computing the test-merge in
  # the background — indistinguishable at the surface from a real conflict.
  # A merge is retried this many times, waiting this long between attempts,
  # but only while GitHub still reports mergeability as unsettled; a settled
  # conflict or block is never retried. See execute._merge_with_retry.
  merge_retry_attempts: 2
  merge_retry_wait: 15

# Spend ceilings in USD, enforced in code against real `usage` blocks.
budget:
  max_per_run: 1.00
  max_per_month: 20.00
  # Corpus larger than this is split per-repo rather than sent as one request.
  assessment_token_ceiling: 150000
  # The real constraint is output length, not input: each PR produces a
  # rationale plus per-question evidence, so a big batch truncates long before
  # the input approaches the context limit. 18 PRs overran a 16k output cap.
  max_prs_per_assessment: 8
  assessment_max_output_tokens: 32000

models:
  assess: claude-sonnet-5
  adversary: claude-haiku-4-5
  diagnose: claude-haiku-4-5
  delta: claude-haiku-4-5
  summary: claude-haiku-4-5
  escalate: claude-opus-5 # workflow_dispatch only, never the nightly path

# `output_config.effort` is not accepted by every model — Haiku 4.5 rejects it
# with a 400. Roles running on Haiku therefore leave it empty, which the client
# translates into omitting the parameter entirely. If you move a role onto an
# effort-capable model, set a level here; tests/test_config_contract.py enforces
# that the two stay consistent.
effort:
  assess: medium # claude-sonnet-5 — supported
  adversary: "" # claude-haiku-4-5 — not supported
  diagnose: "" # claude-haiku-4-5 — not supported
  delta: "" # claude-haiku-4-5 — not supported
  summary: "" # claude-haiku-4-5 — not supported

# Adversarial second opinion on every LOW rating — DISABLED.
#
# The idea was a cheap independent reviewer arguing against each proposed merge,
# to counteract the assessor's bias toward finishing the task. In practice it
# raised three objections across four runs and all three were fabrications:
#
#   1. called changelog dates 2026-08-07 / 2026-08-05 "future-dated" (both past)
#   2. claimed sharp was pinned to "latest-minor" (real diff: ^0.35.2 -> ^0.35.3)
#   3. called a 2026-08-01 changelog entry "in the future" (14 days past)
#
# Zero real issues found, three good merges blocked. Objections 1 and 3 are the
# same date-comparison error, and 3 was made *after* the prompt was given both
# today's date and the manifest diff — so the failure survived the two fixes
# aimed directly at it.
#
# Asking a small model to manufacture a specific objection reliably produces a
# specific objection, whether or not one exists. The deterministic guards remain
# the real safety layer, and unlike this they are 100% covered and cannot invent
# anything. Set to true to re-enable, ideally on a stronger model first.
adversary:
  enabled: false

# Ask Dependabot to rebuild a branch when a red PR looks like a lockfile
# desync rather than a genuine incompatibility. Dependabot does the rebuild, so
# the agent still never writes a file. Recreate force-pushes, so it is refused
# outright on any branch carrying human commits.
remediate:
  enabled: true
  max_recreates_per_run: 4

# Skip a PR that already received a "left for review" verdict in a previous
# run and has not moved its head SHA since — no new commit means no new
# information, so re-running the model and re-commenting would just restate
# what was already said. A PR rejoins full triage the instant Dependabot (or
# a human) pushes a new commit. Guard-blocked (SKIP) and deferred PRs are
# never skipped this way — their eligibility depends on live CI/guard state
# that can change without a new commit, and remediate's recreate-and-retry
# loop needs to keep trying them.
dedupe:
  enabled: true

# Per-PR kill switch.
hold_label: "dependabot-triage:hold"

report:
  from_address: "dependabot-triage@mail.buffingchi.com"
  to_address: "wcmchenry3@gmail.com"
  subject_prefix: "Dependabot Triage"
