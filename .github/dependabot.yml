version: 2

updates:
  # GitHub Actions — keep workflow action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # v5+ does not exist; latest is v4
      - dependency-name: "actions/checkout"
        versions: [">=5"]
      # v5+ does not exist; latest is v4
      - dependency-name: "actions/upload-artifact"
        versions: [">=5"]

  # Cloudflare Email Worker (Node.js)
  - package-ecosystem: "npm"
    directory: "/cloudflare/openai-policy-worker"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
