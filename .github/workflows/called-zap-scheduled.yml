name: ZAP Scheduled Scan

on:
  workflow_call:
    inputs:
      target-url:
        description: 'URL to scan (use for public URLs; use target-url-secret for secret URLs)'
        type: string
        required: false
        default: ''
      artifact-name:
        description: 'Name for the uploaded ZAP report artifact'
        type: string
        required: true
      branches:
        description: 'Comma-separated branches to scan, e.g. "main,dev". Leave empty to always run.'
        type: string
        required: false
        default: ''
    secrets:
      target-url-secret:
        description: 'URL to scan when the URL must be kept secret (takes precedence over target-url input)'
        required: false

jobs:
  zap-scan:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Guard - branch filter
        id: guard
        run: |
          BRANCHES="${{ inputs.branches }}"
          CURRENT="${{ github.ref_name }}"
          if [ -z "$BRANCHES" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif echo "$BRANCHES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -qxF "$CURRENT"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ZAP scan: branch '$CURRENT' not in [$BRANCHES]"
          fi
      - name: Run ZAP baseline scan
        if: ${{ steps.guard.outputs.run == 'true' && (secrets.target-url-secret != '' || inputs.target-url != '') }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.target-url-secret || inputs.target-url }}
          fail_action: false
      - name: Upload ZAP report
        if: ${{ steps.guard.outputs.run == 'true' && (secrets.target-url-secret != '' || inputs.target-url != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}
          path: report_html.html
          retention-days: 30
