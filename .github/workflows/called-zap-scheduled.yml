name: ZAP Scheduled Scan

on:
  workflow_call:
    inputs:
      target-url:
        description: 'URL to scan (use for public URLs; use target-url-secret for secret URLs)'
        type: string
        required: false
        default: ''
      artifact-name:
        description: 'Name for the uploaded ZAP report artifact'
        type: string
        required: true
      branches:
        description: >
          Comma-separated list of branches that should run the scan.
          Leave empty to always run (default). Example: "main,dev"
        type: string
        required: false
        default: ''
    secrets:
      target-url-secret:
        description: 'URL to scan when the URL must be kept secret (takes precedence over target-url input)'
        required: false

jobs:
  zap-scan:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Guard – branch filter
        id: guard
        run: |
          BRANCHES="${{ inputs.branches }}"
          CURRENT="${{ github.ref_name }}"
          if [ -z "$BRANCHES" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif echo "$BRANCHES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -qxF "$CURRENT"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭ Skipping ZAP scan: branch '$CURRENT' not in [$BRANCHES]"
          fi
      - name: Resolve scan URL
        id: scan-url
        run: |
          URL="${{ secrets.target-url-secret }}"
          if [ -z "$URL" ]; then
            URL="${{ inputs.target-url }}"
          fi
          echo "value=$URL" >> "$GITHUB_OUTPUT"
      - name: Run ZAP baseline scan
        if: ${{ steps.guard.outputs.run == 'true' && steps.scan-url.outputs.value != '' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.scan-url.outputs.value }}
          fail_action: false
      - name: Upload ZAP report
        uses: actions/upload-artifact@v7
        if: ${{ steps.guard.outputs.run == 'true' && steps.scan-url.outputs.value != '' }}
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}
          path: report_html.html
          retention-days: 30
