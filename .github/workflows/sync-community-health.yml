name: Sync Community Health Files

# Runs whenever the canonical community-health/ files change on main, or on
# manual dispatch. Opens a PR in each target repo when content differs.
#
# Required secret: COMMUNITY_HEALTH_SYNC_PAT
#   Fine-grained PAT with Contents: write + Pull requests: write on all repos
#   listed in the matrix below: gaming_app, office_holder_cursor, book_app,
#   powerplayshistory_site, wcm_portfolio_site, buffingchi_site.
#   A classic PAT with `repo` scope also works.

on:
  push:
    branches: [main]
    paths:
      - 'community-health/**'
      - '.claude/policies/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Open PRs even if files are already up-to-date'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync → ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - gaming_app
          - office_holder_cursor
          - book_app
          - powerplayshistory_site
          - wcm_portfolio_site
          - buffingchi_site

    steps:
      - uses: actions/checkout@v4

      - name: Sync files to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_HEALTH_SYNC_PAT }}
          REPO: wcmchenry3-stack/${{ matrix.repo }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, urllib.request, urllib.error, sys

          REPO    = os.environ['REPO']
          TOKEN   = os.environ['GH_TOKEN']
          FORCE   = os.environ.get('FORCE', 'false').lower() == 'true'
          BRANCH  = 'chore/sync-community-health'
          API     = 'https://api.github.com'

          FILE_MAP = {
              'community-health/SECURITY.md':
                  'SECURITY.md',
              'community-health/PULL_REQUEST_TEMPLATE.md':
                  '.github/PULL_REQUEST_TEMPLATE.md',
              'community-health/ISSUE_TEMPLATE/bug_report.md':
                  '.github/ISSUE_TEMPLATE/bug_report.md',
              'community-health/ISSUE_TEMPLATE/feature_request.md':
                  '.github/ISSUE_TEMPLATE/feature_request.md',
              '.claude/hooks/lint-on-edit.sh':
                  '.claude/hooks/lint-on-edit.sh',
              '.claude/hooks/lint-gate.sh':
                  '.claude/hooks/lint-gate.sh',
              '.claude/hooks/policy-gate.sh':
                  '.claude/hooks/policy-gate.sh',
              '.claude/agents/plan-issues.md':
                  '.claude/agents/plan-issues.md',
              '.claude/agents/lint-review.md':
                  '.claude/agents/lint-review.md',
              '.claude/agents/policy-compliance.md':
                  '.claude/agents/policy-compliance.md',
              '.claude/policies/policy-patterns.json':
                  '.claude/policies/policy-patterns.json',
              '.claude/policies/openai.md':
                  '.claude/policies/openai.md',
              '.claude/policies/gemini.md':
                  '.claude/policies/gemini.md',
              '.claude/policies/wikipedia.md':
                  '.claude/policies/wikipedia.md',
              '.claude/policies/claude.md':
                  '.claude/policies/claude.md',
              '.claude/policies/design-tokens.md':
                  '.claude/policies/design-tokens.md',
              'community-health/workflows/commitlint.yml':
                  '.github/workflows/commitlint.yml',
              'community-health/workflows/release-please.yml':
                  '.github/workflows/release-please.yml',
              'community-health/workflows/openai-policy.yml':
                  '.github/workflows/openai-policy.yml',
              'community-health/workflows/gemini-policy.yml':
                  '.github/workflows/gemini-policy.yml',
              'community-health/workflows/design-token-check.yml':
                  '.github/workflows/design-token-check.yml',
          }

          def api(path, method='GET', body=None):
              url = f'{API}{path}'
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Authorization', f'Bearer {TOKEN}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data:
                  req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req) as r:
                      return {} if r.status == 204 else json.loads(r.read())
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  msg = e.read().decode()
                  print(f'  HTTP {e.code} {method} {path}: {msg}', file=sys.stderr)
                  sys.exit(1)

          # -- Resolve default branch -----------------------------------------
          repo_info     = api(f'/repos/{REPO}')
          default_branch = repo_info['default_branch']
          print(f'{REPO} (default branch: {default_branch})')

          # -- Diff each file ---------------------------------------------------
          needs_update = []
          for src, dest in FILE_MAP.items():
              new_content = open(src).read()
              current     = api(f'/repos/{REPO}/contents/{dest}?ref={default_branch}')
              if current is None:
                  print(f'  {dest}: missing → will add')
                  needs_update.append((src, dest, new_content))
              else:
                  existing = base64.b64decode(
                      current['content'].replace('\n', '')
                  ).decode()
                  if new_content != existing or FORCE:
                      print(f'  {dest}: differs → will update')
                      needs_update.append((src, dest, new_content))
                  else:
                      print(f'  {dest}: up-to-date')

          # -- Merge PreToolUse and PostToolUse blocks into .claude/settings.json --
          # We never overwrite the whole file — only inject/update the hook keys
          # so repo-specific hooks are preserved.
          import json as _json

          canonical_raw   = open('.claude/settings.json').read()
          canonical       = _json.loads(canonical_raw)
          canonical_hooks = canonical.get('hooks', {})
          canonical_pre   = canonical_hooks.get('PreToolUse', [])
          canonical_post  = canonical_hooks.get('PostToolUse', [])

          if canonical_pre or canonical_post:
              dest_settings = '.claude/settings.json'
              existing_raw  = api(
                  f'/repos/{REPO}/contents/{dest_settings}?ref={default_branch}'
              )
              if existing_raw:
                  existing = _json.loads(
                      base64.b64decode(
                          existing_raw['content'].replace('\n', '')
                      ).decode()
                  )
              else:
                  existing = {'hooks': {}}

              existing.setdefault('hooks', {})
              current_pre  = existing['hooks'].get('PreToolUse', [])
              current_post = existing['hooks'].get('PostToolUse', [])

              changed = False
              if canonical_pre and (current_pre != canonical_pre or FORCE):
                  existing['hooks']['PreToolUse'] = canonical_pre
                  print(f'  {dest_settings}: PreToolUse differs → will merge')
                  changed = True
              if canonical_post and (current_post != canonical_post or FORCE):
                  existing['hooks']['PostToolUse'] = canonical_post
                  print(f'  {dest_settings}: PostToolUse differs → will merge')
                  changed = True

              if changed:
                  merged_content = _json.dumps(existing, indent=2) + '\n'
                  needs_update.append(('__settings_merge__', dest_settings, merged_content))
              else:
                  print(f'  {dest_settings}: hooks already up-to-date')

          if not needs_update:
              print('  Nothing to sync.')
              sys.exit(0)

          # -- Guard against duplicate open PRs ---------------------------------
          open_prs = api(
              f'/repos/{REPO}/pulls'
              f'?state=open&head=wcmchenry3-stack:{BRANCH}'
          )
          if open_prs:
              print(f'  Open sync PR already exists — skipping.')
              sys.exit(0)

          # -- Reset sync branch ------------------------------------------------
          stale = api(f'/repos/{REPO}/git/refs/heads/{BRANCH}')
          if stale:
              api(f'/repos/{REPO}/git/refs/heads/{BRANCH}', method='DELETE')
              print(f'  Removed stale branch.')

          base_sha = api(
              f'/repos/{REPO}/git/refs/heads/{default_branch}'
          )['object']['sha']

          api(f'/repos/{REPO}/git/refs', method='POST', body={
              'ref': f'refs/heads/{BRANCH}',
              'sha': base_sha,
          })
          print(f'  Created branch {BRANCH}.')

          # -- Commit each file -------------------------------------------------
          for src, dest, content in needs_update:
              # content is already a string (either read from disk or merged in-memory)
              encoded      = base64.b64encode(content.encode()).decode()
              on_branch    = api(f'/repos/{REPO}/contents/{dest}?ref={BRANCH}')
              commit_body  = {
                  'message': 'chore: sync community health files from org template',
                  'content': encoded,
                  'branch':  BRANCH,
              }
              if on_branch:
                  commit_body['sha'] = on_branch['sha']
              api(f'/repos/{REPO}/contents/{dest}', method='PUT', body=commit_body)
              print(f'  Committed {dest}')

          # -- Open PR ----------------------------------------------------------
          pr_body = (
              'Automated sync of community health files from '
              '`wcmchenry3-stack/.github`.\n\n'
              '## Files synced\n'
              '**Community health**\n'
              '- `SECURITY.md`\n'
              '- `.github/PULL_REQUEST_TEMPLATE.md`\n'
              '- `.github/ISSUE_TEMPLATE/bug_report.md`\n'
              '- `.github/ISSUE_TEMPLATE/feature_request.md`\n\n'
              '**Claude Code hooks**\n'
              '- `.claude/hooks/lint-on-edit.sh` _(immediate lint feedback on file edits)_\n'
              '- `.claude/hooks/lint-gate.sh` _(blocks `gh pr create` if lint fails)_\n'
              '- `.claude/hooks/policy-gate.sh` _(blocks `gh pr create` if policy files detected)_\n\n'
              '**Claude Code agents**\n'
              '- `.claude/agents/plan-issues.md` _(structured GitHub issue planning)_\n'
              '- `.claude/agents/lint-review.md` _(auto-fixes lint issues)_\n'
              '- `.claude/agents/policy-compliance.md` _(reviews and fixes policy violations)_\n\n'
              '**Claude Code settings**\n'
              '- `.claude/settings.json` _(merged: PreToolUse and PostToolUse hooks wired up)_\n\n'
              '**Policy definitions** _(used by `policy-gate.sh` and the policy-compliance agent)_\n'
              '- `.claude/policies/policy-patterns.json` _(detection patterns for all policies)_\n'
              '- `.claude/policies/openai.md`\n'
              '- `.claude/policies/gemini.md`\n'
              '- `.claude/policies/wikipedia.md`\n'
              '- `.claude/policies/claude.md`\n'
              '- `.claude/policies/design-tokens.md` _(hard-coded CSS values and WCAG 2.2 AA checks)_\n\n'
              '**GitHub Actions caller workflows**\n'
              '- `.github/workflows/commitlint.yml` _(enforces Conventional Commits on PR titles)_\n'
              '- `.github/workflows/release-please.yml` _(automated release PRs, CHANGELOG, and git tags)_\n'
              '- `.github/workflows/openai-policy.yml` _(calls called-openai-policy.yml on PRs)_\n'
              '- `.github/workflows/gemini-policy.yml` _(calls called-gemini-policy.yml on PRs)_\n'
              '- `.github/workflows/design-token-check.yml` _(calls called-design-token-check.yml on PRs)_\n\n'
              '_Auto-generated by `sync-community-health.yml`. '
              'Review and merge to apply the update._'
          )

          pr = api(f'/repos/{REPO}/pulls', method='POST', body={
              'title': 'chore: sync community health files from org template',
              'head':  BRANCH,
              'base':  default_branch,
              'body':  pr_body,
          })
          if pr:
              print(f'  PR opened: {pr["html_url"]}')
          else:
              print('  Failed to open PR.', file=sys.stderr)
              sys.exit(1)
          PYEOF
