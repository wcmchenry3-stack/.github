name: Commitlint (reusable)

# Validates that the PR title follows Conventional Commits format.
# Repos use squash-merge, so the PR title becomes the commit message on main.
# release-please reads these messages to determine version bumps.
#
# Bump rules (pre-1.0.0, bump-minor-pre-major enabled):
#   feat:       → minor bump  (0.1.0 → 0.2.0)
#   fix: perf:  → patch bump  (0.2.0 → 0.2.1)
#   feat!:      → major bump  (0.2.1 → 1.0.0)
#   chore: docs: ci: test: style: refactor: build:
#               → no bump, hidden from CHANGELOG

on:
  workflow_call:

jobs:
  commitlint:
    name: Lint PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
          requireScope: false
          subjectPattern: ^.{1,72}$
          subjectPatternError: >
            PR title subject must be 1–72 characters.
            Example: "feat: add leaderboard" or "fix: correct login redirect"
