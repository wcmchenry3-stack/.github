name: Workflow Failure Monitor

on:
  schedule:
    # Twice daily: 07:00 and 19:00 UTC
    - cron: '0 7,19 * * *'
  workflow_dispatch:

jobs:
  check-failures:
    name: Check org workflow failures
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Scan for recent workflow failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: wcmchenry3-stack
        run: |
          # Repos to monitor (space-separated)
          REPOS="gaming_app office_holder_cursor powerplayshistory_site book_app wcm_portfolio_site buffingchi_site"

          # Look back window: last 25 hours to avoid gaps between runs
          SINCE=$(date -u -d '25 hours ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -u -v-25H '+%Y-%m-%dT%H:%M:%SZ')

          FAILURES=""

          for repo in $REPOS; do
            echo "Checking $repo..."
            failed=$(gh run list \
              --repo "$ORG/$repo" \
              --status failure \
              --created ">$SINCE" \
              --limit 50 \
              --json name,conclusion,url,createdAt,headBranch \
              --jq '.[] | "- **\(.name)** on `\(.headBranch)` — [\(.createdAt)](\(.url))"' \
              2>/dev/null || true)

            if [ -n "$failed" ]; then
              FAILURES="${FAILURES}
          ### \`$ORG/$repo\`
          $failed
          "
            fi
          done

          if [ -z "$FAILURES" ]; then
            echo "No failures found in the last 25 hours."
            exit 0
          fi

          # Dedup: check for an open issue with the same date label (YYYY-MM-DD)
          TODAY=$(date -u '+%Y-%m-%d')
          LABEL="workflow-failure"
          EXISTING=$(gh issue list \
            --repo "$ORG/.github" \
            --label "$LABEL" \
            --state open \
            --json title \
            --jq ".[] | select(.title | contains(\"$TODAY\")) | .title" \
            2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            echo "Issue for $TODAY already exists: $EXISTING — skipping."
            exit 0
          fi

          # Ensure label exists
          gh label create "$LABEL" --repo "$ORG/.github" \
            --description "Automated workflow failure alert" \
            --color "D93F0B" 2>/dev/null || true

          # Close any stale open workflow-failure issues from previous days
          STALE=$(gh issue list \
            --repo "$ORG/.github" \
            --label "$LABEL" \
            --state open \
            --json number \
            --jq '.[].number' \
            2>/dev/null || true)
          for num in $STALE; do
            gh issue close "$num" \
              --repo "$ORG/.github" \
              --comment "Superseded by the $TODAY failure report." \
              2>/dev/null || true
            echo "Closed stale issue #$num."
          done

          gh issue create \
            --repo "$ORG/.github" \
            --title "Workflow failures detected ($TODAY)" \
            --label "$LABEL" \
            --body "## Workflow failures — $TODAY

          The following workflows failed in the last 25 hours.

          $FAILURES

          ---
          *Auto-generated by \`scheduled-workflow-failure-monitor.yml\`. Close this issue once resolved.*"

          echo "Issue created."
